name: L0-ISM Neuro-Symbolic Guardrail Verification CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    branches: [ "main" ]

jobs:
  verify-l0-ism:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch ortools numpy scipy

    - name: Compile C99 RTOS Governor Engine
      run: |
        gcc -std=c99 -Wall -Wextra -Werror -I scripts -O3 scripts/l0_ism_governor.c -o scripts/l0_governor_test

    - name: Run C99 RTOS Verification Driver
      run: |
        ./scripts/l0_governor_test

    - name: Run SMT Z3 / CP-SAT Python Benchmark
      run: |
        python scripts/test_z3_neuro_symbolic.py