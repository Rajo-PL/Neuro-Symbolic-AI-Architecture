name: Z3 Hardware Verification (L0-ISM)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  verify_l0_ism:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Z3 Solver (Microsoft Research)
      run: |
        python -m pip install --upgrade pip
        pip install z3-solver

    - name: Execute L0-ISM Hardware Watchdog PoC
      # Zwróć uwagę na zaktualizowaną ścieżkę uruchamiania (scripts/...)
      run: |
        echo "Initiating Data Physics Verification..."
        python scripts/L0_ISM_Watchdog.py
